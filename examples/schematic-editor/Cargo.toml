[package]
name = "schematic-editor"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
flow-ngin = { path = "../..", features = ["ui", "asset-bundles"] }
anyhow = "1.0.104"
bytemuck = { version = "1.25.2", features = ["derive"] }
cgmath = "0.18.0"
wgpu = "30.0.1"
winit = "0.30.13"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
reqwest = { version = "0.13.5" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
tokio = { version = "1.53.2", features = ["fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3.106"
web-sys = { version = "0.3.106", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "File", "FileList", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "Event", "KeyboardEvent"] }
console_error_panic_hook = "0.1.7"

[dev-dependencies]
futures = "0.3.34"
